[project]
name = "ecg-arrhythmia"
version = "0.1.0"
description = "Deteccion de ondas P/Q/R/S y arritmias en senales ECG (MIT-BIH)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "wfdb>=4.1",
]

[project.scripts]
ecg-arrhythmia = "ecg_arrhythmia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
